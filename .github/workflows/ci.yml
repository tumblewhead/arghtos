      - name: Symbol-size report
        run: |
          for p in r3c r4y r5ag r6b r6c r6d r6e r6f r6i r6j r6k r6l r6m r6n r6o r6p r6q r6q-physical r6r r6s r6t r6u r6v r6z r6aa r6ab r6ac r6ad r6ae r6ag r6ai r6aj r6ak r6am; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -100 "build/m23-$p-symbols.txt" || true
          done

