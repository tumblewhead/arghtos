name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host generic kernel tests
        run: make host-test

      - name: Host accepted size-first selector tests
        run: make host-test-size-selector

      - name: Host profiling-enabled R3c reference
        run: make host-test-r3c

      - name: Host current non-LTO minimum profile R4h
        run: make host-test-r4h

      - name: Host accepted split-metadata profile R4s
        run: make host-test-r4s

      - name: Host accepted entry-overlay profile R4u
        run: make host-test-r4u

      - name: Host live timer-delta recomputation profile R4z
        run: make host-test-r4z

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 compile
        run: make m23-compile

      - name: Cortex-M23 footprint profiling-enabled reference R3c
        run: make m23-footprint-r3c

      - name: Cortex-M23 accepted minimum R4q
        run: make m23-footprint-r4q

      - name: Cortex-M23 accepted compact-PendSV profile R4v
        run: make m23-footprint-r4v

      - name: Cortex-M23 accepted direct-SVC-return profile R4y
        run: make m23-footprint-r4y

      - name: Cortex-M23 live timer-delta recomputation profile R4z
        run: make m23-footprint-r4z

      - name: Symbol-size report
        run: |
          for p in r3c r4y r4z; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
          done
          for p in r3c r4y r4z; do
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -100 "build/m23-$p-symbols.txt" || true
          done

      - name: Upload active footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-r4-footprint
          path: |
            build/footprint-r3c.json
            build/footprint-r4y.json
            build/footprint-r4z.json
            build/m23-r3c.map
            build/m23-r4y.map
            build/m23-r4z.map
            build/m23-r3c-symbols.txt
            build/m23-r4y-symbols.txt
            build/m23-r4z-symbols.txt
            build/m23-r4y.elf
            build/m23-r4z.elf
            build/*.su
