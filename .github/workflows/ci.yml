name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host generic kernel tests
        run: make host-test

      - name: Host accepted size-first selector tests
        run: make host-test-size-selector

      - name: Host profiling-enabled R3c reference
        run: make host-test-r3c

      - name: Host accepted minimum-source profile R4u
        run: make host-test-r4u

      - name: Host live R5i schedule8 profile
        run: make host-test-r5i

      - name: Host live R5c compact wake result
        run: make host-test-r5c

      - name: Host live R5d compact service outcome
        run: make host-test-r5d

      - name: Host live R5e age/deadline overlay
        run: make host-test-r5e

      - name: Host live R5f compressed schedule
        run: make host-test-r5f

      - name: Host live R5g fixed schedule16
        run: make host-test-r5g

      - name: Host live R5h direct schedule16
        run: make host-test-r5h

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 generic compile
        run: make m23-compile

      - name: Cortex-M23 profiling-enabled reference R3c
        run: make m23-footprint-r3c

      - name: Cortex-M23 accepted minimum R4y
        run: make m23-footprint-r4y

      - name: Cortex-M23 live R5a compact PendSV tail
        run: make m23-footprint-r5a

      - name: Cortex-M23 live R5b compact EXC_RETURN tests
        run: make m23-footprint-r5b

      - name: Cortex-M23 live R5c compact wake result
        run: make m23-footprint-r5c

      - name: Cortex-M23 live R5d compact service outcome
        run: make m23-footprint-r5d

      - name: Cortex-M23 live R5e age/deadline overlay
        run: make m23-footprint-r5e

      - name: Cortex-M23 live R5f compressed schedule
        run: make m23-footprint-r5f

      - name: Cortex-M23 live R5g fixed schedule16
        run: make m23-footprint-r5g

      - name: Cortex-M23 live R5h direct schedule16
        run: make m23-footprint-r5h

      - name: Cortex-M23 live R5i schedule8 profile
        run: make m23-footprint-r5i

      - name: Cortex-M23 live R5j 72-byte MSP requalification
        run: make m23-footprint-r5j

      - name: Cortex-M23 live R5k assembly crash fill
        run: make m23-footprint-r5k

      - name: Symbol-size report
        run: |
          for p in r3c r4y r5a r5b r5c r5d r5e r5f r5g r5h r5i r5k; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -100 "build/m23-$p-symbols.txt" || true
          done

      - name: Upload frozen R4 footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-r4-frozen-footprint
          path: |
            build/footprint-r3c.json
            build/footprint-r4y.json
            build/footprint-r5a.json
            build/footprint-r5b.json
            build/footprint-r5c.json
            build/footprint-r5d.json
            build/footprint-r5e.json
            build/footprint-r5f.json
            build/footprint-r5g.json
            build/footprint-r5h.json
            build/footprint-r5i.json
            build/footprint-r5j.json
            build/footprint-r5k.json
            build/m23-r3c.map
            build/m23-r4y.map
            build/m23-r5a.map
            build/m23-r5b.map
            build/m23-r5c.map
            build/m23-r5d.map
            build/m23-r5e.map
            build/m23-r5f.map
            build/m23-r5g.map
            build/m23-r5h.map
            build/m23-r5i.map
            build/m23-r5k.map
            build/m23-r3c-symbols.txt
            build/m23-r4y-symbols.txt
            build/m23-r5a-symbols.txt
            build/m23-r5b-symbols.txt
            build/m23-r5c-symbols.txt
            build/m23-r5d-symbols.txt
            build/m23-r5e-symbols.txt
            build/m23-r5f-symbols.txt
            build/m23-r5g-symbols.txt
            build/m23-r5h-symbols.txt
            build/m23-r5i-symbols.txt
            build/m23-r5k-symbols.txt
            build/m23-r4y.elf
            build/m23-r5a.elf
            build/m23-r5b.elf
            build/m23-r5c.elf
            build/m23-r5d.elf
            build/m23-r5e.elf
            build/m23-r5f.elf
            build/m23-r5g.elf
            build/m23-r5h.elf
            build/m23-r5i.elf
            build/m23-r5k.elf
            build/*.su
