name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host generic kernel tests
        run: make host-test

      - name: Host accepted size-first selector tests
        run: make host-test-size-selector

      - name: Host profiling-enabled R3c reference
        run: make host-test-r3c

      - name: Host accepted minimum-source profile R4u
        run: make host-test-r4u

      - name: Host live R5i schedule8 profile
        run: make host-test-r5i

      - name: Host live R5l prebuilt-context profile
        run: make host-test-r5l

      - name: Host live R5m pristine-init profile
        run: make host-test-r5m

      - name: Host live R5n proven-dispatch profile
        run: make host-test-r5n

      - name: Host live R5o generated minimum-period start
        run: make host-test-r5o

      - name: Host live R5p generated class/RMS order
        run: make host-test-r5p

      - name: Host live R5q partitioned time scan
        run: make host-test-r5q

      - name: Host live R5r proven age-reset elision
        run: make host-test-r5r

      - name: Host live R5s preseeded crash record
        run: make host-test-r5s

      - name: Host live R5t always-armed timer
        run: make host-test-r5t

      - name: Host live R5v unit-period timer
        run: make host-test-r5v

      - name: Host live R5w trusted crash port
        run: make host-test-r5w

      - name: Host live R5y proven periodic state
        run: make host-test-r5y

      - name: Host live R5z raw class schedule
        run: make host-test-r5z

      - name: Host live R5aa delta-only timer
        run: make host-test-r5aa

      - name: Host live R5ab single-async selector
        run: make host-test-r5ab

      - name: Host live R5ac terminal fault-state elision
        run: make host-test-r5ac

      - name: Host live R5c compact wake result
        run: make host-test-r5c

      - name: Host live R5d compact service outcome
        run: make host-test-r5d

      - name: Host live R5e age/deadline overlay
        run: make host-test-r5e

      - name: Host live R5f compressed schedule
        run: make host-test-r5f

      - name: Host live R5g fixed schedule16
        run: make host-test-r5g

      - name: Host live R5h direct schedule16
        run: make host-test-r5h

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 generic compile
        run: make m23-compile

      - name: Cortex-M23 profiling-enabled reference R3c
        run: make m23-footprint-r3c

      - name: Cortex-M23 accepted minimum R4y
        run: make m23-footprint-r4y

      - name: Cortex-M23 live R5a compact PendSV tail
        run: make m23-footprint-r5a

      - name: Cortex-M23 live R5b compact EXC_RETURN tests
        run: make m23-footprint-r5b

      - name: Cortex-M23 live R5c compact wake result
        run: make m23-footprint-r5c

      - name: Cortex-M23 live R5d compact service outcome
        run: make m23-footprint-r5d

      - name: Cortex-M23 live R5e age/deadline overlay
        run: make m23-footprint-r5e

      - name: Cortex-M23 live R5f compressed schedule
        run: make m23-footprint-r5f

      - name: Cortex-M23 live R5g fixed schedule16
        run: make m23-footprint-r5g

      - name: Cortex-M23 live R5h direct schedule16
        run: make m23-footprint-r5h

      - name: Cortex-M23 live R5i schedule8 profile
        run: make m23-footprint-r5i

      - name: Cortex-M23 live R5j 72-byte MSP requalification
        run: make m23-footprint-r5j

      - name: Cortex-M23 live R5k assembly crash fill
        run: make m23-footprint-r5k

      - name: Cortex-M23 live R5l prebuilt-context profile
        run: make m23-footprint-r5l

      - name: Cortex-M23 live R5m pristine-init profile
        run: make m23-footprint-r5m

      - name: Cortex-M23 live R5n proven-dispatch profile
        run: make m23-footprint-r5n

      - name: Cortex-M23 live R5o generated minimum-period start
        run: make m23-footprint-r5o

      - name: Cortex-M23 live R5p generated class/RMS order
        run: make m23-footprint-r5p

      - name: Cortex-M23 live R5q partitioned time scan
        run: make m23-footprint-r5q

      - name: Cortex-M23 live R5r proven age-reset elision
        run: make m23-footprint-r5r

      - name: Cortex-M23 live R5s preseeded crash record
        run: make m23-footprint-r5s

      - name: Cortex-M23 live R5t always-armed timer
        run: make m23-footprint-r5t

      - name: Cortex-M23 live R5u 64-byte MSP requalification
        run: make m23-footprint-r5u

      - name: Cortex-M23 live R5v unit-period timer
        run: make m23-footprint-r5v

      - name: Cortex-M23 live R5w trusted crash port
        run: make m23-footprint-r5w

      - name: Cortex-M23 live R5x forced crash inline
        run: make m23-footprint-r5x

      - name: Cortex-M23 live R5y proven periodic state
        run: make m23-footprint-r5y

      - name: Cortex-M23 live R5z raw class schedule
        run: make m23-footprint-r5z

      - name: Cortex-M23 live R5aa delta-only timer
        run: make m23-footprint-r5aa

      - name: Cortex-M23 live R5ab single-async selector
        run: make m23-footprint-r5ab

      - name: Cortex-M23 live R5ac terminal fault-state elision
        run: make m23-footprint-r5ac

      - name: Cortex-M23 live R5ad compact API veneers
        run: make m23-footprint-r5ad

      - name: Symbol-size report
        run: |
          for p in r3c r4y r5a r5b r5c r5d r5e r5f r5g r5h r5i r5k r5l r5m r5n r5o r5p r5q r5r r5s r5t r5v r5w r5x r5y r5z r5aa r5ab r5ac r5ad; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -100 "build/m23-$p-symbols.txt" || true
          done

      - name: Upload frozen R4 footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-r4-frozen-footprint
          path: |
            build/footprint-r3c.json
            build/footprint-r4y.json
            build/footprint-r5a.json
            build/footprint-r5b.json
            build/footprint-r5c.json
            build/footprint-r5d.json
            build/footprint-r5e.json
            build/footprint-r5f.json
            build/footprint-r5g.json
            build/footprint-r5h.json
            build/footprint-r5i.json
            build/footprint-r5j.json
            build/footprint-r5k.json
            build/footprint-r5l.json
            build/footprint-r5m.json
            build/footprint-r5n.json
            build/footprint-r5o.json
            build/footprint-r5p.json
            build/footprint-r5q.json
            build/footprint-r5r.json
            build/footprint-r5s.json
            build/footprint-r5t.json
            build/footprint-r5u.json
            build/footprint-r5v.json
            build/footprint-r5w.json
            build/footprint-r5x.json
            build/footprint-r5y.json
            build/footprint-r5z.json
            build/footprint-r5aa.json
            build/footprint-r5ab.json
            build/footprint-r5ac.json
            build/footprint-r5ad.json
            build/m23-r3c.map
            build/m23-r4y.map
            build/m23-r5a.map
            build/m23-r5b.map
            build/m23-r5c.map
            build/m23-r5d.map
            build/m23-r5e.map
            build/m23-r5f.map
            build/m23-r5g.map
            build/m23-r5h.map
            build/m23-r5i.map
            build/m23-r5k.map
            build/m23-r5l.map
            build/m23-r5m.map
            build/m23-r5n.map
            build/m23-r5o.map
            build/m23-r5p.map
            build/m23-r5q.map
            build/m23-r5r.map
            build/m23-r5s.map
            build/m23-r5t.map
            build/m23-r5v.map
            build/m23-r5w.map
            build/m23-r5x.map
            build/m23-r5y.map
            build/m23-r5z.map
            build/m23-r5aa.map
            build/m23-r5ab.map
            build/m23-r5ac.map
            build/m23-r5ad.map
            build/m23-r3c-symbols.txt
            build/m23-r4y-symbols.txt
            build/m23-r5a-symbols.txt
            build/m23-r5b-symbols.txt
            build/m23-r5c-symbols.txt
            build/m23-r5d-symbols.txt
