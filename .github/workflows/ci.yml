name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host generic kernel tests
        run: make host-test

      - name: Host accepted size-first selector tests
        run: make host-test-size-selector

      - name: Host profiling-enabled R3c reference
        run: make host-test-r3c

      - name: Host current non-LTO minimum profile R4h
        run: make host-test-r4h

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 compile
        run: make m23-compile

      - name: Cortex-M23 footprint profiling-enabled reference R3c
        run: make m23-footprint-r3c

      - name: Cortex-M23 footprint non-LTO minimum R4h
        run: make m23-footprint-r4h

      - name: Cortex-M23 footprint LTO R4m
        run: make m23-footprint-r4m

      - name: Cortex-M23 footprint LTO omit-frame-pointer R4n
        run: make m23-footprint-r4n

      - name: Cortex-M23 footprint live no-exidx experiment R4p
        run: make m23-footprint-r4p

      - name: Symbol-size report
        run: |
          for p in r3c r4h r4m r4n r4p; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
          done
          for p in r3c r4h r4m r4n r4p; do
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -80 "build/m23-$p-symbols.txt" || true
          done

      - name: Upload active footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-r4-footprint
          path: |
            build/footprint-r3c.json
            build/footprint-r4h.json
            build/footprint-r4m.json
            build/footprint-r4n.json
            build/footprint-r4p.json
            build/m23-r3c.map
            build/m23-r4h.map
            build/m23-r4m.map
            build/m23-r4n.map
            build/m23-r4p.map
            build/m23-r3c-symbols.txt
            build/m23-r4h-symbols.txt
            build/m23-r4m-symbols.txt
            build/m23-r4n-symbols.txt
            build/m23-r4p-symbols.txt
            build/m23-r4n.elf
            build/m23-r4p.elf
            build/*.su
