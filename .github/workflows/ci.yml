name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host kernel tests
        run: make host-test

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 compile
        run: make m23-compile

      - name: Cortex-M23 footprint
        run: make m23-footprint

      - name: Symbol-size report
        run: |
          llvm-nm -S --size-sort --radix=d build/m23.elf > build/m23-symbols.txt || true
          cat build/footprint.json
          tail -80 build/m23-symbols.txt || true

      - name: Upload footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-i1-footprint
          path: |
            build/footprint.json
            build/m23.map
            build/m23-symbols.txt
            build/*.su
