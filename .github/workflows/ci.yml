          with open("build/footprint-r6ab.json", "r", encoding="utf-8") as f:
              ab = json.load(f)
          aav = aa["arghtos_resident_total"]
          abv = ab["arghtos_resident_total"]
          assert abv <= 1536, f"physical R6ab challenger misses target: {abv} B > 1536 B"
          print(f"physical R6aa control: {aav} B; R6ab challenger: {abv} B; delta: {abv-aav} B")
