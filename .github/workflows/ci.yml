name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host generic kernel tests
        run: make host-test

      - name: Host accepted size-first selector tests
        run: make host-test-size-selector

      - name: Host profiling-enabled R3c reference
        run: make host-test-r3c

      - name: Host accepted minimum-source R4u
        run: make host-test-r4u

      - name: Host frozen R5ag semantic profile
        run: make host-test-r5ag

      - name: Host R6b trusted timer-entry control
        run: make host-test-r6b

      - name: Host R6c zero-sleep control
        run: make host-test-r6c

      - name: Host R6d serialized-handler control
        run: make host-test-r6d

      - name: Host R6e serialized-SVC control
        run: make host-test-r6e

      - name: Host R6f trusted-service-domain control
        run: make host-test-r6f

      - name: Host R6j proven-wake-domain control
        run: make host-test-r6j

      - name: Host R6k preseeded-periodic-ready control
        run: make host-test-r6k

      - name: Host R6l pre-masked-start control
        run: make host-test-r6l

      - name: Host R6m commit-recursion control
        run: make host-test-r6m

      - name: Host R6n dispatch-only-service control
        run: make host-test-r6n

      - name: Host R6o preseeded-current control
        run: make host-test-r6o

      - name: Host R6p preinitialized-kernel control
        run: make host-test-r6p

      - name: Host R6q preseeded-deadline control
        run: make host-test-r6q

      - name: Host R6r flagless-kernel challenger
        run: make host-test-r6r

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 generic compile
        run: make m23-compile

      - name: Cortex-M23 profiling-enabled reference R3c
        run: make m23-footprint-r3c

      - name: Cortex-M23 frozen minimum R4y
        run: make m23-footprint-r4y

      - name: Cortex-M23 frozen target-crossing R5ag
        run: make m23-footprint-r5ag

      - name: Cortex-M23 R6b trusted timer-entry control
        run: make m23-footprint-r6b

      - name: Cortex-M23 R6c zero-sleep control
        run: make m23-footprint-r6c

      - name: Cortex-M23 R6d serialized-handler control
        run: make m23-footprint-r6d

      - name: Cortex-M23 R6e serialized-SVC control
        run: make m23-footprint-r6e

      - name: Cortex-M23 R6f trusted-service-domain control
        run: make m23-footprint-r6f

      - name: Cortex-M23 R6i known-unmasked PendSV control
        run: make m23-footprint-r6i

      - name: Cortex-M23 R6j proven-wake-domain control
        run: make m23-footprint-r6j

      - name: Cortex-M23 R6k preseeded-periodic-ready control
        run: make m23-footprint-r6k

      - name: Cortex-M23 R6l pre-masked-start control
        run: make m23-footprint-r6l

      - name: Cortex-M23 R6m commit-recursion control
        run: make m23-footprint-r6m

      - name: Cortex-M23 R6n dispatch-only-service control
        run: make m23-footprint-r6n

      - name: Cortex-M23 R6o preseeded-current control
        run: make m23-footprint-r6o

      - name: Cortex-M23 R6p preinitialized-kernel control
        run: make m23-footprint-r6p

      - name: Cortex-M23 R6q preseeded-deadline control
        run: make m23-footprint-r6q

      - name: Cortex-M23 R6r flagless-kernel challenger
        run: make m23-footprint-r6r

      - name: Enforce R5ag 1536-byte resident target
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r5ag.json", "r", encoding="utf-8") as f:
              report = json.load(f)
          resident = report["arghtos_resident_total"]
          assert resident <= 1536, f"R5ag resident footprint regressed: {resident} B > 1536 B"
          assert report["target_met"] is True
          print(f"R5ag resident footprint: {resident} B")
          PY

      - name: Symbol-size report
        run: |
          for p in r3c r4y r5ag r6b r6c r6d r6e r6f r6i r6j r6k r6l r6m r6n r6o r6p r6q r6r; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -100 "build/m23-$p-symbols.txt" || true
          done

      - name: Upload frozen footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-frozen-footprint
          path: |
            build/footprint-r3c.json
            build/footprint-r4y.json
            build/footprint-r5ag.json
            build/footprint-r6b.json
            build/footprint-r6c.json
            build/footprint-r6d.json
            build/footprint-r6e.json
            build/footprint-r6f.json
            build/footprint-r6i.json
            build/footprint-r6j.json
            build/footprint-r6k.json
            build/footprint-r6l.json
            build/footprint-r6m.json
            build/footprint-r6n.json
            build/footprint-r6o.json
            build/footprint-r6p.json
            build/footprint-r6q.json
            build/footprint-r6r.json
            build/m23-r3c.map
            build/m23-r4y.map
            build/m23-r5ag.map
            build/m23-r6b.map
            build/m23-r6c.map
            build/m23-r6d.map
            build/m23-r6e.map
            build/m23-r6f.map
            build/m23-r6i.map
            build/m23-r6j.map
            build/m23-r6k.map
            build/m23-r6l.map
            build/m23-r6m.map
            build/m23-r6n.map
            build/m23-r6o.map
            build/m23-r6p.map
            build/m23-r6q.map
            build/m23-r6r.map
            build/m23-r3c-symbols.txt
            build/m23-r4y-symbols.txt
            build/m23-r5ag-symbols.txt
            build/m23-r6b-symbols.txt
            build/m23-r6c-symbols.txt
            build/m23-r6d-symbols.txt
            build/m23-r6e-symbols.txt
            build/m23-r6f-symbols.txt
            build/m23-r6i-symbols.txt
            build/m23-r6j-symbols.txt
            build/m23-r6k-symbols.txt
            build/m23-r6l-symbols.txt
            build/m23-r6m-symbols.txt
            build/m23-r6n-symbols.txt
            build/m23-r6o-symbols.txt
            build/m23-r6p-symbols.txt
            build/m23-r6q-symbols.txt
            build/m23-r6r-symbols.txt
            build/m23-r4y.elf
            build/m23-r5ag.elf
            build/m23-r6b.elf
            build/m23-r6c.elf
            build/m23-r6d.elf
            build/m23-r6e.elf
            build/m23-r6f.elf
            build/m23-r6i.elf
            build/m23-r6j.elf
            build/m23-r6k.elf
            build/m23-r6l.elf
            build/m23-r6m.elf
            build/m23-r6n.elf
            build/m23-r6o.elf
            build/m23-r6p.elf
            build/m23-r6q.elf
            build/m23-r6r.elf
            build/*.su
