              ae = json.load(f)
          with open("build/footprint-r6ag.json", "r", encoding="utf-8") as f:
              ag = json.load(f)
          aev = ae["arghtos_resident_total"]
          agv = ag["arghtos_resident_total"]
          assert agv <= 1536, f"physical R6ag challenger misses target: {agv} B > 1536 B"
          print(f"physical R6ae control: {aev} B; R6ag challenger: {agv} B; delta: {agv-aev} B")
          PY

      - name: Evaluate R6ai physical challenger
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6ag.json", "r", encoding="utf-8") as f:
              ag = json.load(f)
          with open("build/footprint-r6ai.json", "r", encoding="utf-8") as f:
              ai = json.load(f)
          agv = ag["arghtos_resident_total"]
          aiv = ai["arghtos_resident_total"]
          assert aiv <= 1536, f"physical R6ai challenger misses target: {aiv} B > 1536 B"
          print(f"physical R6ag control: {agv} B; R6ai challenger: {aiv} B; delta: {aiv-agv} B")
          PY

      - name: Evaluate R6aj correctness repair
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6ag.json", "r", encoding="utf-8") as f:
              ag = json.load(f)
          with open("build/footprint-r6ai.json", "r", encoding="utf-8") as f:
              ai = json.load(f)
          with open("build/footprint-r6aj.json", "r", encoding="utf-8") as f:
              aj = json.load(f)
          agv = ag["arghtos_resident_total"]
          aiv = ai["arghtos_resident_total"]
          ajv = aj["arghtos_resident_total"]
          assert ajv <= 1536, f"physical R6aj misses target: {ajv} B > 1536 B"
          assert ajv < aiv, f"R6aj does not improve correctness control: {ajv} B >= {aiv} B"
          print(
              f"historical R6ag size-only: {agv} B; "
              f"R6ai correctness control: {aiv} B; "
              f"R6aj: {ajv} B; "
              f"delta vs R6ai: {ajv-aiv} B; "
              f"delta vs R6ag: {ajv-agv} B"
          )
          PY

      - name: Evaluate R6ak physical challenger
