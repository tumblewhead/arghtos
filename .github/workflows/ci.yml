name: arghtos-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          gcc --version
          clang --version
          python3 --version

      - name: Portable-source boundary
        run: make portability-check

      - name: Host generic kernel tests
        run: make host-test

      - name: Host accepted size-first selector tests
        run: make host-test-size-selector

      - name: Host profiling-enabled R3c reference
        run: make host-test-r3c

      - name: Host accepted minimum-source R4u
        run: make host-test-r4u

      - name: Host frozen R5ag semantic profile
        run: make host-test-r5ag

      - name: Host R6b trusted timer-entry control
        run: make host-test-r6b

      - name: Host R6c zero-sleep control
        run: make host-test-r6c

      - name: Host R6d serialized-handler control
        run: make host-test-r6d

      - name: Host R6e serialized-SVC control
        run: make host-test-r6e

      - name: Host R6f trusted-service-domain control
        run: make host-test-r6f

      - name: Host R6j proven-wake-domain control
        run: make host-test-r6j

      - name: Host R6k preseeded-periodic-ready control
        run: make host-test-r6k

      - name: Host R6l pre-masked-start control
        run: make host-test-r6l

      - name: Host R6m commit-recursion control
        run: make host-test-r6m

      - name: Host R6n dispatch-only-service control
        run: make host-test-r6n

      - name: Host R6o preseeded-current control
        run: make host-test-r6o

      - name: Host R6p preinitialized-kernel control
        run: make host-test-r6p

      - name: Host R6q preseeded-deadline control
        run: make host-test-r6q

      - name: Host R6r flagless-kernel control
        run: make host-test-r6r

      - name: Host R6s delta-only-timer control
        run: make host-test-r6s

      - name: Host R6t unit-period-timer control
        run: make host-test-r6t

      - name: Host R6u singleton-async-unit-timer control
        run: make host-test-r6u

      - name: Host R6v always-dispatch-tick control
        run: make host-test-r6v

      - name: Host R6y packed-missed-add challenger
        run: make host-test-r6y

      - name: Host sanitizers
        run: make host-sanitize

      - name: Cortex-M23 generic compile
        run: make m23-compile

      - name: Cortex-M23 profiling-enabled reference R3c
        run: make m23-footprint-r3c

      - name: Cortex-M23 frozen minimum R4y
        run: make m23-footprint-r4y

      - name: Cortex-M23 frozen target-crossing R5ag
        run: make m23-footprint-r5ag

      - name: Cortex-M23 R6b trusted timer-entry control
        run: make m23-footprint-r6b

      - name: Cortex-M23 R6c zero-sleep control
        run: make m23-footprint-r6c

      - name: Cortex-M23 R6d serialized-handler control
        run: make m23-footprint-r6d

      - name: Cortex-M23 R6e serialized-SVC control
        run: make m23-footprint-r6e

      - name: Cortex-M23 R6f trusted-service-domain control
        run: make m23-footprint-r6f

      - name: Cortex-M23 R6i known-unmasked PendSV control
        run: make m23-footprint-r6i

      - name: Cortex-M23 R6j proven-wake-domain control
        run: make m23-footprint-r6j

      - name: Cortex-M23 R6k preseeded-periodic-ready control
        run: make m23-footprint-r6k

      - name: Cortex-M23 R6l pre-masked-start control
        run: make m23-footprint-r6l

      - name: Cortex-M23 R6m commit-recursion control
        run: make m23-footprint-r6m

      - name: Cortex-M23 R6n dispatch-only-service control
        run: make m23-footprint-r6n

      - name: Cortex-M23 R6o preseeded-current control
        run: make m23-footprint-r6o

      - name: Cortex-M23 R6p preinitialized-kernel control
        run: make m23-footprint-r6p

      - name: Cortex-M23 R6q historical legacy-harness control
        run: make m23-footprint-r6q

      - name: Cortex-M23 R6q physical-board control
        run: make m23-footprint-r6q-physical

      - name: Cortex-M23 R6r flagless-kernel physical control
        run: make m23-footprint-r6r

      - name: Cortex-M23 R6s delta-only-timer physical control
        run: make m23-footprint-r6s

      - name: Cortex-M23 R6t unit-period-timer physical control
        run: make m23-footprint-r6t

      - name: Cortex-M23 R6u singleton-async-unit-timer physical control
        run: make m23-footprint-r6u

      - name: Cortex-M23 R6v always-dispatch-tick physical control
        run: make m23-footprint-r6v

      - name: Cortex-M23 R6y packed-missed-add physical challenger
        run: make m23-footprint-r6y

      - name: Enforce R5ag 1536-byte resident target
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r5ag.json", "r", encoding="utf-8") as f:
              report = json.load(f)
          resident = report["arghtos_resident_total"]
          assert resident == 1534, f"R5ag legacy-harness reproduction changed: {resident} B != 1534 B"
          assert report["target_met"] is True
          print(f"R5ag historical legacy-harness footprint reproduced: {resident} B")
          PY

      - name: Enforce physical R6 target and accepted R6r improvement
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6q-physical.json", "r", encoding="utf-8") as f:
              q = json.load(f)
          with open("build/footprint-r6r.json", "r", encoding="utf-8") as f:
              r = json.load(f)
          qv = q["arghtos_resident_total"]
          rv = r["arghtos_resident_total"]
          assert qv <= 1536, f"physical R6q control misses target: {qv} B > 1536 B"
          assert rv <= 1536, f"physical R6r control misses target: {rv} B > 1536 B"
          assert rv < qv, f"R6r does not improve physical R6q: {rv} B >= {qv} B"
          print(f"physical R6q: {qv} B; R6r: {rv} B; delta: {rv-qv} B")
          PY

      - name: Evaluate R6s physical challenger
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6r.json", "r", encoding="utf-8") as f:
              r = json.load(f)
          with open("build/footprint-r6s.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          rv = r["arghtos_resident_total"]
          sv = s["arghtos_resident_total"]
          assert sv <= 1536, f"physical R6s challenger misses target: {sv} B > 1536 B"
          print(f"physical R6r control: {rv} B; R6s challenger: {sv} B; delta: {sv-rv} B")
          PY

      - name: Evaluate R6t physical challenger
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6s.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          with open("build/footprint-r6t.json", "r", encoding="utf-8") as f:
              t = json.load(f)
          sv = s["arghtos_resident_total"]
          tv = t["arghtos_resident_total"]
          assert tv <= 1536, f"physical R6t challenger misses target: {tv} B > 1536 B"
          print(f"physical R6s control: {sv} B; R6t challenger: {tv} B; delta: {tv-sv} B")
          PY

      - name: Evaluate R6u physical challenger
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6t.json", "r", encoding="utf-8") as f:
              t = json.load(f)
          with open("build/footprint-r6u.json", "r", encoding="utf-8") as f:
              u = json.load(f)
          tv = t["arghtos_resident_total"]
          uv = u["arghtos_resident_total"]
          assert uv <= 1536, f"physical R6u challenger misses target: {uv} B > 1536 B"
          print(f"physical R6t control: {tv} B; R6u challenger: {uv} B; delta: {uv-tv} B")
          PY

      - name: Evaluate R6v physical challenger
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6u.json", "r", encoding="utf-8") as f:
              u = json.load(f)
          with open("build/footprint-r6v.json", "r", encoding="utf-8") as f:
              v = json.load(f)
          uv = u["arghtos_resident_total"]
          vv = v["arghtos_resident_total"]
          assert vv <= 1536, f"physical R6v challenger misses target: {vv} B > 1536 B"
          print(f"physical R6u control: {uv} B; R6v challenger: {vv} B; delta: {vv-uv} B")
          PY

      - name: Evaluate R6y physical challenger
        run: |
          python3 - <<'PY'
          import json
          with open("build/footprint-r6v.json", "r", encoding="utf-8") as f:
              v = json.load(f)
          with open("build/footprint-r6y.json", "r", encoding="utf-8") as f:
              y = json.load(f)
          vv = v["arghtos_resident_total"]
          yv = y["arghtos_resident_total"]
          assert yv <= 1536, f"physical R6y challenger misses target: {yv} B > 1536 B"
          print(f"physical R6v control: {vv} B; R6y challenger: {yv} B; delta: {yv-vv} B")
          PY

      - name: Symbol-size report
        run: |
          for p in r3c r4y r5ag r6b r6c r6d r6e r6f r6i r6j r6k r6l r6m r6n r6o r6p r6q r6q-physical r6r r6s r6t r6u r6v r6y; do
            nm -S --size-sort --radix=d "build/m23-$p.elf" > "build/m23-$p-symbols.txt" || true
            echo "--- $p footprint ---"
            cat "build/footprint-$p.json"
            echo "--- largest $p symbols ---"
            tail -100 "build/m23-$p-symbols.txt" || true
          done

      - name: Upload frozen footprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: arghtos-frozen-footprint
          path: |
            build/footprint-r3c.json
            build/footprint-r4y.json
            build/footprint-r5ag.json
            build/footprint-r6b.json
            build/footprint-r6c.json
            build/footprint-r6d.json
            build/footprint-r6e.json
            build/footprint-r6f.json
            build/footprint-r6i.json
            build/footprint-r6j.json
            build/footprint-r6k.json
            build/footprint-r6l.json
            build/footprint-r6m.json
            build/footprint-r6n.json
            build/footprint-r6o.json
            build/footprint-r6p.json
            build/footprint-r6q.json
            build/footprint-r6q-physical.json
            build/footprint-r6r.json
            build/footprint-r6s.json
            build/footprint-r6t.json
            build/footprint-r6u.json
            build/footprint-r6v.json
            build/footprint-r6y.json
            build/m23-r3c.map
            build/m23-r4y.map
            build/m23-r5ag.map
            build/m23-r6b.map
            build/m23-r6c.map
            build/m23-r6d.map
            build/m23-r6e.map
            build/m23-r6f.map
            build/m23-r6i.map
            build/m23-r6j.map
            build/m23-r6k.map
            build/m23-r6l.map
            build/m23-r6m.map
            build/m23-r6n.map
            build/m23-r6o.map
            build/m23-r6p.map
            build/m23-r6q.map
            build/m23-r6q-physical.map
            build/m23-r6r.map
            build/m23-r6s.map
            build/m23-r6t.map
            build/m23-r6u.map
            build/m23-r6v.map
            build/m23-r6y.map
            build/m23-r3c-symbols.txt
            build/m23-r4y-symbols.txt
            build/m23-r5ag-symbols.txt
            build/m23-r6b-symbols.txt
            build/m23-r6c-symbols.txt
            build/m23-r6d-symbols.txt
            build/m23-r6e-symbols.txt
            build/m23-r6f-symbols.txt
            build/m23-r6i-symbols.txt
            build/m23-r6j-symbols.txt
            build/m23-r6k-symbols.txt
            build/m23-r6l-symbols.txt
            build/m23-r6m-symbols.txt
            build/m23-r6n-symbols.txt
            build/m23-r6o-symbols.txt
            build/m23-r6p-symbols.txt
            build/m23-r6q-symbols.txt
            build/m23-r6q-physical-symbols.txt
            build/m23-r6r-symbols.txt
            build/m23-r6s-symbols.txt
            build/m23-r6t-symbols.txt
            build/m23-r6u-symbols.txt
            build/m23-r6v-symbols.txt
            build/m23-r6y-symbols.txt
            build/m23-r4y.elf
            build/m23-r5ag.elf
            build/m23-r6b.elf
            build/m23-r6c.elf
            build/m23-r6d.elf
            build/m23-r6e.elf
            build/m23-r6f.elf
            build/m23-r6i.elf
            build/m23-r6j.elf
            build/m23-r6k.elf
            build/m23-r6l.elf
            build/m23-r6m.elf
            build/m23-r6n.elf
            build/m23-r6o.elf
            build/m23-r6p.elf
            build/m23-r6q.elf
            build/m23-r6q-physical.elf
            build/m23-r6r.elf
            build/m23-r6s.elf
